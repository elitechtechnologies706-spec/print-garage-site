kind = "web"
previewPath = "/"
title = "Print Garage"
description = "Print Garage printing and branding in Kampala, with source-backed product catalogues and WhatsApp enquiries."
version = "1.0.0"
id = "artifacts/brimas-media"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20947

[services.development]
run = "pnpm --filter @workspace/brimas-media run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/brimas-media", "run", "build" ]
serve = "static"
publicDir = "artifacts/brimas-media/dist/public"

[[services.production.rewrites]]
from = "/printing-services-kampala"
to = "/printing-services-kampala.html"

